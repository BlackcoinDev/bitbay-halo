[mypy]
# Add Bitmessage directories to the module search path
mypy_path = Bitmessage:Bitmessage/src

# Ignore missing imports for third-party libraries without stubs
ignore_missing_imports = False

# Show error codes in output
show_error_codes = True

# Per-module overrides for legacy code
[mypy-pyelliptic.*]
ignore_missing_imports = True

[mypy-pyopencl.*]
ignore_missing_imports = True

[mypy-rpyc.*]
ignore_missing_imports = True

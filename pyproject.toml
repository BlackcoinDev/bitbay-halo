[project]
name = "blackhalo"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.0.0",
    "pycryptodome>=3.23.0",
    "pyinstaller>=6.17.0",
    "pyqt6>=6.10.1",
    "pyqt6-webengine>=6.10.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pyzmail39>=0.0.2",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "setuptools>=80.9.0",
    "stopit>=1.1.2",
]

[tool.isort]
profile = "black"
line_length = 120
skip = ["venv", ".venv", "__pycache__", "Bitmessage-BitMHalo-v0.6", "BUILD SCRIPTS ETC", "bridge", "data", "agent", "BitMData", "images"]

[tool.black]
line-length = 120
target-version = ["py314"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | Bitmessage-BitMHalo-v0\.6
  | BUILD\ SCRIPTS\ ETC
  | bridge
  | data
  | agent
  | BitMData
  | images
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=Bitmessage --cov=highlevelcrypto --cov-report=term-missing"

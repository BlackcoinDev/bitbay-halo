[project]
name = "blackhalo"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "base58>=2.1.1",
    "beautifulsoup4>=4.14.3",
    "black>=25.12.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mechanize>=0.4.10",
    "msgpack>=1.1.2",
    "pillow>=12.0.0",
    "pycryptodome>=3.23.0",
    "pydenticon>=0.3.1",
    "pyinstaller>=6.17.0",
    "pylint>=4.0.4",
    "pyqt6>=6.10.1",
    "pyqt6-qt6>=6.10.1",
    "pyqt6-webengine>=6.10.0",
    "pyright>=1.1.407",
    "pysocks>=1.7.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "python-bitcoinrpc>=1.0",
    "python-bsonjs>=0.7.0",
    "pyzmail39>=0.0.2",
    "qrcode>=8.2",
    "requests>=2.32.5",
    "rpyc>=6.0.2",
    "ruff>=0.14.10",
    "selenium>=4.39.0",
    "setuptools>=80.9.0",
    "stepic>=0.5.0",
    "stopit>=1.1.2",
    "ujson>=5.11.0",
    "yandex-translate>=0.3.5",
]

[tool.isort]
profile = "black"
line_length = 120
skip = ["venv", ".venv", "__pycache__", "Bitmessage-BitMHalo-v0.6", "BUILD SCRIPTS ETC", "bridge", "data", "agent", "BitMData", "images"]

[tool.black]
line-length = 120
target-version = ["py314"]
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | Bitmessage-BitMHalo-v0\.6
  | BUILD\ SCRIPTS\ ETC
  | bridge
  | data
  | agent
  | BitMData
  | images
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=Bitmessage --cov=highlevelcrypto --cov-report=term-missing"

[project]
name = "blackhalo"
version = "1.0.0"
requires-python = ">=3.14"
description = "BlackHalo - Smart Contracts & Decentralized Exchange"
dependencies = [
    "pyqt6>=6.10.1",
    "pyqt6-qt6>=6.10.1",
    "pyqt6-sip>=13.10.3",
    "pyqt6-webengine>=6.10.0",
    "pyqt6-webengine-qt6>=6.10.1",
    "pillow>=12.0.0",
    "pycryptodome>=3.23.0",
    "cryptography>=46.0.3",
    "cffi>=2.0.0",
    "pycparser>=2.23",
    "base58>=2.1.1",
    "python-bitcoinrpc>=1.0",
    "pytokens>=0.3.0",
    "requests>=2.32.5",
    "urllib3>=2.6.2",
    "certifi>=2025.11.12",
    "charset-normalizer>=3.4.4",
    "idna>=3.11",
    "pysocks>=1.7.1",
    "websocket-client>=1.9.0",
    "wsproto>=1.3.2",
    "h11>=0.16.0",
    "trio>=0.32.0",
    "trio-websocket>=0.12.2",
    "sniffio>=1.3.1",
    "outcome>=1.3.0.post0",
    "selenium>=4.39.0",
    "mechanize>=0.4.10",
    "html5lib>=0.999999999",
    "webencodings>=0.5.1",
    "pyzmail39>=0.0.2",
    "msgpack>=1.1.2",
    "ujson>=5.11.0",
    "python-bsonjs>=0.7.0",
    "sortedcontainers>=2.4.0",
    "qrcode>=8.2",
    "pydenticon>=0.3.1",
    "stepic>=0.5.0",
    "yandex-translate>=0.3.5",
    "rpyc>=6.0.2",
    "click>=8.3.1",
    "packaging>=25.0",
    "plumbum>=1.10.0",
    "attrs>=25.4.0",
    "stopit>=1.1.2",
    "six>=1.17.0",
    "setuptools>=75.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "coverage>=7.13.1",
    "black>=25.12.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "pyright>=1.1.407",
    "pylint>=4.0.4",
    "astroid>=4.0.2",
    "pyflakes>=3.4.0",
    "pycodestyle>=2.14.0",
    "mccabe>=0.7.0",
    "iniconfig>=2.3.0",
]
macos = [
    "py2app>=0.28.9",
]

[tool.isort]
profile = "black"
line_length = 180
skip = ["venv", ".venv", "__pycache__", ".tox"]

[tool.black]
line-length = 180
target-version = ["py314"]
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | venv
  | __pycache__
)/
'''

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=Bitmessage --cov=highlevelcrypto --cov-report=term-missing"



[dependency-groups]
dev = [
    "black>=25.12.0",
    "flake8>=7.3.0",
    "isort>=7.0.0",
    "pyright>=1.1.407",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "tox>=4.34.1",
    "tox-uv>=1.29.0",
    "types-pywin32>=311.0.0.20251008",
    "types-requests>=2.32.4.20260107",
    "types-setuptools>=80.9.0.20251223",
    "types-PySocks>=1.7.1",
    "types-ujson>=5.10.0.20250822",
    "types-qrcode>=8.2.0.20250914",
]
